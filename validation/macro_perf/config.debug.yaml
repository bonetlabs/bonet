# BONet forwarding benchmark configuration.
#
# Debug profile: short PDR runs for sanity checks and troubleshooting.
# Covers all 8 experiments (IPv4 + IPv6) with 1 rep and wide window to complete quickly.

sut:
  mode: ssh
  bonet_root: /path/to/bonet
  sudo: true
  settle_seconds: 1
  ssh:
    host: 192.0.2.10
    user: benchmark
    key: /path/to/ssh_key
    port: 22

trex:
  server: 127.0.0.1
  api_path: /opt/trex/v3.08/automation/trex_control_plane/interactive
  tx_port: 0
  rx_port: 1
  duration: 5
  warmup: 1
  samples: 1
  stats_settle_seconds: 1

network:
  sut_rx_iface: eth1
  sut_rx_ipv4: 10.8.0.2
  sut_rx_prefix: 24
  sut_rx_mac: "02:00:00:00:01:02"

  sut_tx_iface: eth2
  sut_tx_ipv4: 10.7.0.2
  sut_tx_prefix: 24
  sut_tx_mac: "02:00:00:00:02:02"

  tg_tx_ipv4: 10.8.0.1
  tg_tx_mac: "02:00:00:00:01:01"

  tg_rx_ipv4: 10.7.0.1
  tg_rx_mac: "02:00:00:00:02:01"

  traffic_src_ipv4: 10.8.0.1
  traffic_dst_ipv4: 48.0.0.2
  traffic_dst_prefix: 24
  traffic_ttl: 64
  udp_src_port: 12345
  udp_dst_port: 54321

  sut_rx_ipv6: "fd08::2"
  sut_rx_ipv6_prefix: 64
  sut_tx_ipv6: "fd07::2"
  sut_tx_ipv6_prefix: 64
  tg_tx_ipv6: "fd08::1"
  tg_rx_ipv6: "fd07::1"
  traffic_src_ipv6: "fd08::1"
  traffic_dst_ipv6: "fd03::2"
  traffic_dst_ipv6_prefix: 64

  # Optional IRQ pinning. Leave empty for the default profile.
  # If you fill these fields, first validate the IRQ/queue mapping on the SUT.
  sut_rx_irq_min:
  sut_rx_irq_max:
  sut_rx_irq_core:
  sut_tx_irq_min:
  sut_tx_irq_max:
  sut_tx_irq_core:

xdp:
  mode: xdpdrv
  section: xdp

tc:
  section: tc

build:
  enabled: true

perf:
  pcap_dir: pcap
  output_dir: results

cases:
  - framework
  - baseline
  - framework-tc
  - baseline-tc
  - kernel

experiments:
  - name: ipv4-forward-78-pdr
    rate: pdr
    frame_size: 78
    runs: 1
    starting_tx_rate_pps: 50000
    max_tx_rate_pps: 3000000
    ndr_window_pps: 100000
    delivery_ratio: 0.995
    objects:
      framework: validation/framework/xdp_fib4_forward.o
      baseline: validation/baseline/xdp_fib4_forward.o
      framework-tc: validation/framework/tc_fib4_forward.o
      baseline-tc: validation/baseline/tc_fib4_forward.o

  - name: mmlf-78-pdr
    rate: pdr
    frame_size: 78
    runs: 1
    starting_tx_rate_pps: 50000
    max_tx_rate_pps: 3000000
    ndr_window_pps: 100000
    delivery_ratio: 0.995
    objects:
      framework: validation/framework/xdp_mmlf.o
      baseline: validation/baseline/xdp_mmlf.o
      framework-tc: validation/framework/tc_mmlf.o
      baseline-tc: validation/baseline/tc_mmlf.o

  - name: ipip-encap-78-pdr
    rate: pdr
    frame_size: 78
    runs: 1
    starting_tx_rate_pps: 50000
    max_tx_rate_pps: 3000000
    ndr_window_pps: 100000
    delivery_ratio: 0.995
    pcap_dst_ipv4: 10.100.0.1
    pcap_dst_prefix: 24
    objects:
      framework: validation/framework/xdp_ipip_encap.o
      baseline: validation/baseline/xdp_ipip_encap.o
      framework-tc: validation/framework/tc_ipip_encap.o
      baseline-tc: validation/baseline/tc_ipip_encap.o

  - name: static-dnat-78-pdr
    rate: pdr
    frame_size: 78
    runs: 1
    starting_tx_rate_pps: 50000
    max_tx_rate_pps: 3000000
    ndr_window_pps: 100000
    delivery_ratio: 0.995
    traffic_udp_checksum: true
    objects:
      framework: validation/framework/xdp_static_dnat.o
      baseline: validation/baseline/xdp_static_dnat.o
      framework-tc: validation/framework/tc_static_dnat.o
      baseline-tc: validation/baseline/tc_static_dnat.o

  - name: ipv6-forward-78-pdr
    rate: pdr
    ip_version: 6
    frame_size: 78
    runs: 1
    starting_tx_rate_pps: 50000
    max_tx_rate_pps: 3000000
    ndr_window_pps: 100000
    delivery_ratio: 0.995
    objects:
      framework: validation/framework/xdp_fib6_forward.o
      baseline: validation/baseline/xdp_fib6_forward.o
      framework-tc: validation/framework/tc_fib6_forward.o
      baseline-tc: validation/baseline/tc_fib6_forward.o

  - name: mmlf6-78-pdr
    rate: pdr
    ip_version: 6
    frame_size: 78
    runs: 1
    starting_tx_rate_pps: 50000
    max_tx_rate_pps: 3000000
    ndr_window_pps: 100000
    delivery_ratio: 0.995
    objects:
      framework: validation/framework/xdp_mmlf6.o
      baseline: validation/baseline/xdp_mmlf6.o
      framework-tc: validation/framework/tc_mmlf6.o
      baseline-tc: validation/baseline/tc_mmlf6.o

  - name: srv6-encap-78-pdr
    rate: pdr
    ip_version: srv6
    frame_size: 78
    runs: 1
    starting_tx_rate_pps: 50000
    max_tx_rate_pps: 3000000
    ndr_window_pps: 100000
    delivery_ratio: 0.995
    pcap_dst_ipv4: 10.100.0.1
    pcap_dst_prefix: 24
    objects:
      framework: validation/framework/xdp_srv6_encap.o
      baseline: validation/baseline/xdp_srv6_encap.o
      framework-tc: validation/framework/tc_srv6_encap.o
      baseline-tc: validation/baseline/tc_srv6_encap.o

  - name: static-dnat6-78-pdr
    rate: pdr
    ip_version: 6
    frame_size: 78
    runs: 1
    starting_tx_rate_pps: 50000
    max_tx_rate_pps: 3000000
    ndr_window_pps: 100000
    delivery_ratio: 0.995
    traffic_udp_checksum: true
    objects:
      framework: validation/framework/xdp_static_dnat6.o
      baseline: validation/baseline/xdp_static_dnat6.o
      framework-tc: validation/framework/tc_static_dnat6.o
      baseline-tc: validation/baseline/tc_static_dnat6.o
